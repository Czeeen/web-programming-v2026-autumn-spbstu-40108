<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Учет путешествий (Лабораторная работа 4)</h1>
      <form data-testid="entity-form" class="main-form">
        <input
          type="number"
          name="id"
          placeholder="ID путешествия (число)"
          required
        />
        <input
          type="text"
          name="travelerName"
          placeholder="Имя путешественника"
          required
        />
        <button type="submit">Добавить путешествие</button>
      </form>
      <section
        data-testid="entity-list"
        aria-label="Список элементов"
      ></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
